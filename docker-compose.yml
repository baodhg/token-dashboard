# Two ways to run:
#
#   1. Bundled database (zero setup — for anyone who clones the repo):
#        docker compose --profile bundled up -d --build
#      Starts a throwaway PostgreSQL in a container; the app re-syncs your data
#      from the local tool logs on first run.
#
#   2. Your own host PostgreSQL (keeps existing data — set DATABASE_URL_DOCKER in .env):
#        docker compose up -d --build
#      The app connects to PostgreSQL already running on your machine.
#
# All per-user values come from the root .env (see .env.example). Anything not set
# falls back to the defaults below, which target the bundled database.

services:
  db:
    image: postgres:17-alpine
    profiles: ["bundled"]          # only starts with `--profile bundled`
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-token_dashboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_RACE_SERVER_URL: ${NEXT_PUBLIC_RACE_SERVER_URL:-http://localhost:9876}
    restart: always
    environment:
      # Default points at the bundled db service. To use your own host PostgreSQL,
      # set DATABASE_URL_DOCKER in .env using host.docker.internal as the host, e.g.
      #   postgresql://postgres:PASS@host.docker.internal:5432/token_dashboard?schema=public
      # (a container's "localhost" is the container itself, never the host machine).
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://postgres:postgres@db:5432/token_dashboard?schema=public}
      # Browser-facing race URL (runs on the host -> localhost is correct).
      NEXT_PUBLIC_RACE_SERVER_URL: ${NEXT_PUBLIC_RACE_SERVER_URL:-http://localhost:9876}
      # Server-side race URL (app -> race-server container, by service name).
      RACE_SERVER_URL: ${RACE_SERVER_URL_DOCKER:-http://race-server:9876}
      RACE_PLAYER_NAME: ${RACE_PLAYER_NAME:-}
      RACE_PLAYER_PASSWORD: ${RACE_PLAYER_PASSWORD:-}
      RACE_PERIOD: ${RACE_PERIOD:-1d}
      # Chart time-bucketing uses the server's local time (Date.getHours/getDate).
      # Without this a UTC container shifts every hour/day bucket by the host offset
      # (e.g. -7h for Vietnam). Defaults to Asia/Ho_Chi_Minh; override TZ in .env.
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      # Sync adapters read tool logs from os.homedir(); HOME points at the mounted profile.
      HOME: /host-home
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Host AI-tool logs, mounted read-only so the sync adapters can read them.
      # HOST_HOME defaults to the Windows profile; on macOS/Linux set HOST_HOME=$HOME
      # (and VSCODE_USER_DIR) in .env — see .env.example.
      - ${HOST_HOME:-${USERPROFILE}}/.claude:/host-home/.claude:ro
      - ${HOST_HOME:-${USERPROFILE}}/.gemini:/host-home/.gemini:ro
      # .codex is read-write: its SQLite DB is WAL mode and SQLite must write the
      # -shm wal-index even for read-only opens (adapter still opens { readonly: true }).
      - ${HOST_HOME:-${USERPROFILE}}/.codex:/host-home/.codex
      # Cline (globalStorage) + Copilot (workspaceStorage) live under the VS Code User dir.
      # The container always reads it at the Windows-shaped path, so map your OS path here.
      - ${VSCODE_USER_DIR:-${USERPROFILE}/AppData/Roaming/Code/User}:/host-home/AppData/Roaming/Code/User:ro
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      # race-server waits on this so the app migrates the schema FIRST when both
      # share the bundled db (the app must create _prisma_migrations before
      # race-server adds its race_* tables, else `migrate deploy` hits P3005).
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s

  race-server:
    build:
      context: ./race-server
      dockerfile: Dockerfile
    restart: always
    depends_on:
      app:
        condition: service_healthy
    environment:
      # Falls back to the app's DB (DATABASE_URL_DOCKER) when unset, then to the
      # bundled db. Set RACE_SERVER_DATABASE_URL only to use a separate/remote race DB.
      DATABASE_URL: ${RACE_SERVER_DATABASE_URL:-${DATABASE_URL_DOCKER:-postgresql://postgres:postgres@db:5432/token_dashboard?schema=public}}
      PORT: 9876
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_KEY: ${ADMIN_KEY:-admin}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    ports:
      - "${RACE_PORT:-9876}:9876"

volumes:
  postgres_data:
