services:
  race-server:
    build: .
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      # Comma-separated allowed origins, e.g. "http://localhost:3000,https://your-domain.com"
      ALLOWED_ORIGINS: "*"
      # Change these before deploying!
      JWT_SECRET: "change-me-to-a-long-random-string"
      ADMIN_KEY: "change-me-admin-key"
      DATA_DIR: "/app/data"
      # Same PostgreSQL as your dashboard — for leaderboard & history.
      # If your DB is on the host machine, use host.docker.internal instead of localhost.
      DATABASE_URL: "postgresql://postgres:password@host.docker.internal:5432/token_dashboard"
    volumes:
      # Persist users.json outside the container
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
