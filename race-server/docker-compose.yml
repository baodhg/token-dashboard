services:
  race-server:
    build: .
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      # Comma-separated list of allowed origins.
      # Example: ALLOWED_ORIGINS: "http://localhost:3000,https://your-dashboard.com"
      ALLOWED_ORIGINS: "*"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
